<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marsie — de animaties</title><style>body{margin:0;background:#102e44;color:#f5fbff;font:17px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0}p{color:#c4e1ee}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:24px}figure{margin:0}img{display:block;width:100%;height:auto}figcaption{padding:8px 0}button{font:inherit;border:0;border-radius:9px;background:#ffdf85;padding:10px 16px;margin:12px 0 24px;color:#172d3c;cursor:pointer}</style></head><body><main><h1>Marsie neemt het over</h1><p>Andere kleren per weertype. De rollator verschijnt alleen in de storm-en-regengrap voor het wijkcentrum.</p><button id="pause" type="button" aria-pressed="false">Animaties pauzeren</button><div class="grid"><figure><img src="marsie/zon.webp" data-key="zon" alt="Zon en zacht weer: Marsie met bril en witte baard"><figcaption>Zon en zacht weer</figcaption></figure><figure><img src="marsie/wandelen.webp" data-key="wandelen" alt="Gewoon een frisse dag: Marsie met bril en witte baard"><figcaption>Gewoon een frisse dag</figcaption></figure><figure><img src="marsie/regen.webp" data-key="regen" alt="Lopen in de regen: Marsie met bril en witte baard"><figcaption>Lopen in de regen</figcaption></figure><figure><img src="marsie/storm.webp" data-key="storm" alt="Tegen de wind in: Marsie met bril en witte baard"><figcaption>Tegen de wind in</figcaption></figure><figure><img src="marsie/kou.webp" data-key="kou" alt="Kou en sneeuw: Marsie met bril en witte baard"><figcaption>Kou en sneeuw</figcaption></figure><figure><img src="marsie/auto.webp" data-key="auto" alt="In de auto: Marsie met bril en witte baard"><figcaption>In de auto</figcaption></figure><figure><img src="marsie/motor.webp" data-key="motor" alt="Op de motor: Marsie met bril en witte baard"><figcaption>Op de motor</figcaption></figure><figure><img src="marsie/wijk-stormregen.webp" data-key="wijk-stormregen" alt="Wijkcentrum: storm-en-regengrap: Marsie met bril en witte baard"><figcaption>Wijkcentrum: storm-en-regengrap</figcaption></figure></div></main><script>const pause=document.getElementById('pause');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function update(){document.querySelectorAll('[data-key]').forEach(img=>img.src='marsie/'+img.dataset.key+(paused?'-stil.png':'.webp'));pause.textContent=paused?'Animaties afspelen':'Animaties pauzeren';pause.setAttribute('aria-pressed',String(paused));}pause.addEventListener('click',()=>{paused=!paused;update()});update();</script></body></html>
